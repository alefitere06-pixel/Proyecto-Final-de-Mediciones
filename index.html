<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gate Balboa · Dashboard de cola y citas</title>
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-titulo">
      <h1>Gate Balboa · Dashboard de cola y citas</h1>
      <span class="sello-simulado">DATOS SIMULADOS</span>
    </div>
    <nav id="pestanas" class="pestanas" aria-label="Módulos"></nav>
  </header>

  <main>
    <section class="filtros">
      <label>Día analizado
        <select id="filtro-dia"></select>
      </label>
      <span id="info-dia" class="info-dia"></span>
    </section>

    <p class="titulo-seccion">Situación actual del día (sin mejoras) · los módulos 2, 4 y 5 simulan escenarios</p>
    <!-- Tarjetas KPI: se llenan desde js/app.js con las fórmulas de js/kpi.js -->
    <section id="tarjetas-kpi" class="tarjetas" aria-label="KPI principales"></section>

    <!-- Aquí cada módulo dibuja su contenido -->
    <section id="contenido-modulo" class="modulo"></section>
  </main>

  <footer class="pie">
    Proyecto semestral · Medición y Rendimiento de Terminales Portuarias · UMIP ·
    Todos los datos son <strong>simulados</strong> (data/generar_datos.py, semilla fija).
  </footer>

  <!-- Orden de carga: librería → datos → fórmulas → módulos → app -->
  <script src="js/lib/chart.umd.js"></script>
  <script src="js/lib/leaflet.js"></script>
  <script src="data/llegadas.js"></script>
  <script src="js/kpi.js"></script>
  <script src="js/escenarios.js"></script>
  <script src="js/animacion.js"></script>
  <script>const MODULOS = [];</script>
  <script src="js/modulos/llegadas.js"></script>
  <script src="js/modulos/simulador.js"></script>
  <script src="js/modulos/ttt.js"></script>
  <script src="js/modulos/citas.js"></script>
  <script src="js/modulos/mejora.js"></script>
  <script src="js/modulos/mapa.js"></script>
  <script src="js/presentacion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
